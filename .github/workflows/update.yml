name: Update feeds

on:
  schedule:
    # 04:30 UTC = 08:00 Tehran (UTC+3:30). GitHub may start it a few minutes late.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_feeds.py
      - name: Commit changes
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add feeds.json translations_cache.json
          git diff --staged --quiet || git commit -m "Daily update"
          git push
